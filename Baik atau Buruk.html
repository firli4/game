<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Baik atau Buruk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: satu kolom sempit seperti buku cerita. Gambar besar di atas, dua tombol jawaban besar di bawah. */
:root {
  --bg: #E6F2FA;
  --card: #FFFFFF;
  --ink: #15314A;
  --muted: #47657F;
  --line: #C4DAEA;
  --sun: #FFC62E;
  --good-bg: #0F7A49;
  --good-fg: #FFFFFF;
  --good-soft: #DDF5E8;
  --bad-bg: #C7371F;
  --bad-fg: #FFFFFF;
  --bad-soft: #FFE6E0;
  --sky: #CFEAFB;
  --ground: #9ED48F;
  --btn: #15314A;
  --btn-fg: #FFFFFF;
  --font-display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1E2E; --card: #15304A; --ink: #EAF4FC; --muted: #9FBBD0; --line: #2A4D6B;
    --good-bg: #46D192; --good-fg: #062616; --good-soft: #12402D;
    --bad-bg: #FF8D75; --bad-fg: #3A0A02; --bad-soft: #4A2019;
    --sky: #1E4F78; --ground: #3C7A4B; --btn: #EAF4FC; --btn-fg: #0D1E2E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1E2E; --card: #15304A; --ink: #EAF4FC; --muted: #9FBBD0; --line: #2A4D6B;
  --good-bg: #46D192; --good-fg: #062616; --good-soft: #12402D;
  --bad-bg: #FF8D75; --bad-fg: #3A0A02; --bad-soft: #4A2019;
  --sky: #1E4F78; --ground: #3C7A4B; --btn: #EAF4FC; --btn-fg: #0D1E2E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3, .display { font-family: var(--font-display); font-weight: 700; line-height: 1.1; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.brand svg { width: 38px; height: 38px; flex: none; }
.best { font-size: 14px; font-weight: 800; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.best svg { width: 18px; height: 18px; }

.card { background: var(--card); border: 2px solid var(--line); border-radius: 24px; overflow: hidden; }
.scene svg { display: block; width: 100%; height: auto; }

/* Layar mulai */
.hero { display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }
.hero h1 { font-size: clamp(36px, 10vw, 52px); }
.hero p { color: var(--muted); font-size: 18px; max-width: 34ch; }
.samples { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sample { position: relative; }
.chip {
  position: absolute; left: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px 5px 8px; border-radius: 999px; font-family: var(--font-display); font-weight: 700; font-size: 16px;
}
.chip svg { width: 18px; height: 18px; }
.chip.good { background: var(--good-bg); color: var(--good-fg); }
.chip.bad { background: var(--bad-bg); color: var(--bad-fg); }
.note { font-size: 15px; color: var(--muted); }

.primary {
  background: var(--btn); color: var(--btn-fg); border: 0; border-radius: 20px;
  min-height: 60px; padding: 12px 24px; font-family: var(--font-display); font-weight: 700; font-size: 24px;
  transition: transform .12s ease;
}
.primary:active { transform: scale(.97); }

/* Layar bermain */
.progress { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.count { font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.stars { display: flex; gap: 3px; }
.stars svg { width: 20px; height: 20px; }
.stars .s { fill: none; stroke: var(--line); stroke-width: 2; stroke-linejoin: round; }
.stars .ok .s { fill: var(--sun); stroke: #C98E00; }
.stars .no .s { fill: var(--line); stroke: var(--line); }
.stars .now .s { stroke: var(--ink); }

.scene-wrap { animation: pop .35s ease both; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.caption-row { display: flex; align-items: flex-start; gap: 12px; }
.caption { font-family: var(--font-display); font-weight: 600; font-size: 23px; line-height: 1.25; flex: 1; min-width: 0; }
.listen {
  flex: none; width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--line);
  background: var(--card); display: grid; place-items: center;
}
.listen svg { width: 26px; height: 26px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ask { font-size: 16px; font-weight: 800; color: var(--muted); }

.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.answer {
  border: 0; border-radius: 22px; min-height: 96px; padding: 12px 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-family: var(--font-display); font-weight: 800; font-size: 28px; transition: transform .12s ease;
}
.answer svg { width: 36px; height: 36px; }
.answer:active { transform: scale(.96); }
.answer.good { background: var(--good-bg); color: var(--good-fg); }
.answer.bad { background: var(--bad-bg); color: var(--bad-fg); }

.feedback { border: 2px solid; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px; animation: pop .3s ease both; }
.feedback.good { background: var(--good-soft); border-color: var(--good-bg); }
.feedback.bad { background: var(--bad-soft); border-color: var(--bad-bg); }
.feedback h2 { font-size: 26px; display: flex; align-items: center; gap: 10px; }
.feedback h2 svg { width: 34px; height: 34px; flex: none; }
.feedback .why { font-size: 18px; }
.feedback .tip { font-size: 16px; color: var(--muted); font-weight: 700; }
.feedback:focus { outline: none; }

/* Layar hasil */
.result { text-align: center; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.result .big { font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: 1; }
.result .big small { font-size: 24px; font-weight: 700; color: var(--muted); }
.result .stars { justify-content: center; flex-wrap: wrap; }
.result .stars svg { width: 28px; height: 28px; }
.result h2 { font-size: 28px; }
.result p { color: var(--muted); max-width: 32ch; }
.result .primary { width: 100%; }

@media (max-width: 380px) {
  .caption { font-size: 20px; }
  .answer { font-size: 24px; min-height: 88px; }
}
@media (prefers-reduced-motion: reduce) {
  .scene-wrap, .feedback { animation: none; }
  .primary, .answer { transition: none; }
}
</style>

<main class="app">
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="13" cy="20" r="11" fill="#0F7A49"/>
        <circle cx="27" cy="20" r="11" fill="#C7371F"/>
        <path d="M8 20.5l3.5 3.5 6-7" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M23 16l8 8M31 16l-8 8" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
      </svg>
      <span>Baik atau Buruk</span>
    </div>
    <div class="best" id="best" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.1 6.6 7.2.9-5.3 5 1.4 7.2L12 18.3 5.6 21.7 7 14.5 1.7 9.5l7.2-.9z" fill="#FFC62E" stroke="#C98E00" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span id="bestText"></span>
    </div>
  </div>

  <section id="start" class="hero">
    <h1>Baik atau buruk, ya?</h1>
    <p>Lihat gambarnya, lalu tebak apakah perilaku itu baik atau buruk.</p>
    <div class="samples" id="samples"></div>
    <button class="primary" id="startBtn" type="button">Ayo mulai</button>
    <p class="note">Ada 10 gambar setiap permainan. Orang tua atau guru bisa mendampingi anak dan membicarakan jawabannya setelah tiap gambar.</p>
  </section>

  <section id="play" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="progress">
        <span class="count" id="count"></span>
        <div class="stars" id="stars" aria-hidden="true"></div>
      </div>
      <div class="card scene scene-wrap" id="scene"></div>
      <div class="caption-row">
        <p class="caption" id="caption" tabindex="-1"></p>
        <button class="listen" id="listen" type="button" aria-label="Dengarkan kalimat" hidden>
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        </button>
      </div>
      <div id="answerArea">
        <p class="ask" style="margin-bottom:10px">Perilaku ini baik atau buruk?</p>
        <div class="answers">
          <button class="answer good" id="goodBtn" type="button">
            <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M10 18.5l5.5 5.5L26 13" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Baik
          </button>
          <button class="answer bad" id="badBtn" type="button">
            <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M12 12l12 12M24 12L12 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></svg>
            Buruk
          </button>
        </div>
      </div>
      <div class="feedback" id="feedback" tabindex="-1" aria-live="polite" hidden></div>
    </div>
  </section>

  <section id="end" class="card result" hidden>
    <div class="stars" id="endStars" aria-hidden="true"></div>
    <div class="big"><span id="endScore"></span> <small>dari 10</small></div>
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <button class="primary" id="againBtn" type="button">Main lagi</button>
  </section>
</main>

<script>
(function () {
  var INK = '#1B1B1B';
  var LINE = '#15314A';

  /* ---------- Menggambar tokoh ---------- */
  function kid(x, o) {
    var c = Object.assign({ skin: '#F2C29B', hair: '#3A2A21', shirt: '#3F8EF0', pants: '#2C3E66', mood: 'happy', s: 1,
      aL: [-8, 16], aR: [8, 16], gaze: 0, brow: '', style: 'short', glasses: false }, o || {});
    var g = '';
    if (c.style === 'long') g += '<rect x="-16.5" y="-67" width="33" height="31" rx="12" fill="' + c.hair + '"/>';
    g += '<g stroke="' + c.pants + '" stroke-width="7" stroke-linecap="round"><line x1="-6" y1="-16" x2="-6" y2="-3"/><line x1="6" y1="-16" x2="6" y2="-3"/></g>';
    g += '<ellipse cx="-6" cy="-1" rx="6.5" ry="3.2" fill="#2A2A2A"/><ellipse cx="6" cy="-1" rx="6.5" ry="3.2" fill="#2A2A2A"/>';
    g += '<rect x="-13" y="-47" width="26" height="33" rx="10" fill="' + c.shirt + '"/>';
    function arm(sx, a) {
      return '<line x1="' + sx + '" y1="-40" x2="' + (sx + a[0]) + '" y2="' + (-40 + a[1]) + '" stroke="' + c.shirt + '" stroke-width="7" stroke-linecap="round"/>' +
        '<circle cx="' + (sx + a[0]) + '" cy="' + (-40 + a[1]) + '" r="4.2" fill="' + c.skin + '"/>';
    }
    g += arm(-12, c.aL) + arm(12, c.aR);
    if (c.style === 'pig') {
      g += '<circle cx="-18" cy="-57" r="5.5" fill="' + c.hair + '"/><circle cx="18" cy="-57" r="5.5" fill="' + c.hair + '"/>';
    }
    g += '<circle cx="0" cy="-60" r="15" fill="' + c.skin + '"/>';
    if (c.style === 'bun') g += '<circle cx="0" cy="-77" r="6.5" fill="' + c.hair + '"/>';
    g += '<path d="M-15.5 -61 A15.5 15.5 0 0 1 15.5 -61 Q9 -70 0 -68 Q-9 -70 -15.5 -61Z" fill="' + c.hair + '"/>';
    g += '<circle cx="' + (-5.5 + c.gaze) + '" cy="-60" r="2.1" fill="' + INK + '"/><circle cx="' + (5.5 + c.gaze) + '" cy="-60" r="2.1" fill="' + INK + '"/>';
    if (c.brow === 'angry') g += '<path d="M-9.5 -67 L-2.5 -64.5 M9.5 -67 L2.5 -64.5" stroke="' + INK + '" stroke-width="1.8" stroke-linecap="round"/>';
    if (c.brow === 'sad') g += '<path d="M-9.5 -64.5 L-2.5 -67 M9.5 -64.5 L2.5 -67" stroke="' + INK + '" stroke-width="1.8" stroke-linecap="round"/>';
    if (c.glasses) g += '<g fill="none" stroke="#333" stroke-width="1.4"><circle cx="-5.5" cy="-60" r="5"/><circle cx="5.5" cy="-60" r="5"/><line x1="-0.5" y1="-60" x2="0.5" y2="-60"/></g>';
    var m = c.mood, mouth = '';
    if (m === 'happy') {
      g += '<g fill="#FF8AA0" opacity=".55"><circle cx="-9.5" cy="-54.5" r="2.6"/><circle cx="9.5" cy="-54.5" r="2.6"/></g>';
      mouth = '<path d="M-6 -54 Q0 -46.5 6 -54" fill="none" stroke="' + INK + '" stroke-width="1.8" stroke-linecap="round"/>';
    } else if (m === 'laugh') mouth = '<path d="M-7 -55 Q0 -41 7 -55Z" fill="#7A1F1F"/>';
    else if (m === 'sad') {
      mouth = '<path d="M-5 -49.5 Q0 -55 5 -49.5" fill="none" stroke="' + INK + '" stroke-width="1.8" stroke-linecap="round"/>' +
        '<path d="M-9.5 -57 q-2.5 5 0 6.5 q2.5 -1.5 0 -6.5Z" fill="#59B7FF"/>';
    } else if (m === 'neutral') mouth = '<path d="M-4 -51.5 L4 -51.5" stroke="' + INK + '" stroke-width="1.8" stroke-linecap="round"/>';
    else if (m === 'worry') mouth = '<path d="M-5 -50.5 Q-2.5 -54 0 -50.5 T5 -50.5" fill="none" stroke="' + INK + '" stroke-width="1.7" stroke-linecap="round"/>';
    else if (m === 'shout') mouth = '<ellipse cx="0" cy="-51" rx="3.8" ry="3.2" fill="#7A1F1F"/>';
    g += mouth;
    return '<g transform="translate(' + x + ' 170) scale(' + c.s + ')">' + g + '</g>';
  }

  function base() {
    return '<rect width="320" height="200" style="fill:var(--sky)"/><circle cx="276" cy="36" r="17" fill="#FFD54A"/>' +
      '<g fill="#fff" opacity=".85"><ellipse cx="62" cy="30" rx="26" ry="9"/><ellipse cx="80" cy="24" rx="16" ry="8"/><ellipse cx="205" cy="22" rx="22" ry="7"/></g>' +
      '<rect y="170" width="320" height="30" style="fill:var(--ground)"/>';
  }

  function bubble(cx, top, t, tx) {
    tx = tx == null ? cx : tx;
    var w = t.length * 6.9 + 24, x = cx - w / 2;
    return '<polygon points="' + (tx - 6) + ',' + (top + 25) + ' ' + (tx + 6) + ',' + (top + 25) + ' ' + tx + ',' + (top + 37) + '" fill="#fff" stroke="' + LINE + '" stroke-width="1.6" stroke-linejoin="round"/>' +
      '<rect x="' + x + '" y="' + top + '" width="' + w + '" height="27" rx="13" fill="#fff" stroke="' + LINE + '" stroke-width="1.6"/>' +

  }

  function heart(x, y, s, col) {
    return '<path transform="translate(' + x + ' ' + y + ') scale(' + s + ')" d="M0 -4 C-8 -13 -15 -3 0 8 C15 -3 8 -13 0 -4Z" fill="' + (col || '#FF5C8A') + '"/>';
  }

  function bin(x, y) {
    return '<rect x="' + x + '" y="' + y + '" width="42" height="' + (170 - y) + '" rx="4" fill="#2E86DE"/>' +
      '<g stroke="#1F5FA8" stroke-width="2"><line x1="' + (x + 12) + '" y1="' + (y + 8) + '" x2="' + (x + 12) + '" y2="164"/><line x1="' + (x + 21) + '" y1="' + (y + 8) + '" x2="' + (x + 21) + '" y2="164"/><line x1="' + (x + 30) + '" y1="' + (y + 8) + '" x2="' + (x + 30) + '" y2="164"/></g>';
  }

  /* ---------- Daftar gambar ---------- */
  var SCENES = [
    {
      id: 'tolong', kind: 'good',
      caption: 'Bimo membantu temannya mengambil buku yang jatuh.',
      alt: 'Seorang anak menyerahkan buku kepada temannya yang bukunya berserakan di tanah',
      why: 'Menolong teman yang sedang kesulitan membuatnya lega dan senang. Ini perilaku baik.',
      tip: 'Kapan terakhir kali kamu menolong temanmu?',
      art: function () {
        return base() +
          '<rect x="58" y="162" width="28" height="8" rx="1.5" fill="#F2A33A"/><rect x="72" y="154" width="26" height="8" rx="1.5" fill="#E4572E" transform="rotate(-8 85 158)"/><rect x="44" y="165" width="20" height="5" rx="1" fill="#6C5CE7"/>' +
          kid(100, { shirt: '#3F8EF0', mood: 'sad', aL: [-14, 20], aR: [20, -2] }) +
          kid(185, { shirt: '#E85D9C', style: 'pig', hair: '#2B2020', mood: 'happy', aL: [-38, -4], aR: [10, 16], skin: '#D79B6F' }) +
          '<rect x="125" y="119" width="22" height="14" rx="2" fill="#2FAE7A" transform="rotate(-6 136 126)"/><line x1="129" y1="123" x2="143" y2="122" stroke="#fff" stroke-width="1.6"/>' +
          bubble(185, 50, 'Ini bukumu!', 185);
      }
    },
    {
      id: 'ejek', kind: 'bad',
      caption: 'Beberapa anak menertawakan dan mengejek temannya.',
      alt: 'Dua anak menunjuk dan menertawakan seorang anak yang menangis',
      why: 'Mengejek membuat teman sedih dan merasa tidak dihargai. Lebih baik bersikap ramah.',
      tip: 'Bagaimana perasaanmu kalau diejek? Apa yang bisa kamu lakukan untuk temanmu?',
      art: function () {
        return base() +
          kid(80, { shirt: '#3F8EF0', mood: 'sad', brow: 'sad', aL: [-4, 20], aR: [6, 20], skin: '#D79B6F' }) +
          kid(205, { shirt: '#F2A33A', mood: 'laugh', aL: [-48, -22], aR: [8, 16] }) +
          kid(266, { shirt: '#8E6CEF', style: 'pig', hair: '#3A2A21', mood: 'laugh', aL: [-6, 14], aR: [6, 14], skin: '#A86B45' }) +
          bubble(190, 52, 'Hahaha, kamu aneh!', 205);
      }
    },
    {
      id: 'sampah-sembarangan', kind: 'bad',
      caption: 'Dina membuang bungkus permen di jalan, padahal ada tempat sampah.',
      alt: 'Seorang anak melempar bungkus permen ke tanah, sementara tempat sampah ada di dekatnya',
      why: 'Sampah sembarangan membuat lingkungan kotor dan bisa menyumbat saluran air.',
      tip: 'Di mana tempat sampah terdekat dari rumahmu?',
      art: function () {
        return base() +
          '<rect x="196" y="159" width="9" height="11" rx="2" fill="#C9D3DC"/><circle cx="224" cy="165" r="5" fill="#fff" stroke="#AAB7C3"/><path d="M170 168 q6 -6 12 0 q-6 3 -12 0Z" fill="#E4572E"/>' +
          bin(250, 132) + '<rect x="246" y="125" width="50" height="8" rx="3" fill="#1F5FA8"/>' +
          kid(110, { shirt: '#2FAE7A', style: 'pig', hair: '#2B2020', mood: 'neutral', aL: [-8, 16], aR: [36, -16] }) +
          '<g transform="translate(160 112) rotate(24)"><rect x="-9" y="-5" width="18" height="10" rx="2" fill="#FF5A5F"/><path d="M-9 -5 l-6 5 l6 5 M9 -5 l6 5 l-6 5" fill="#FF5A5F" stroke="#FF5A5F" stroke-width="1.5" stroke-linejoin="round"/></g>' +
          '<g stroke="' + LINE + '" stroke-width="2" stroke-linecap="round"><line x1="178" y1="104" x2="190" y2="100"/><line x1="180" y1="114" x2="194" y2="114"/><line x1="176" y1="124" x2="188" y2="128"/></g>';
      }
    },
    {
      id: 'sampah-tempat', kind: 'good',

  /* ---------- Antarmuka ---------- */

  var TOTAL = 10, order = [], idx = 0, score = 0, results = [], locked = false, best = null;

  function sceneSvg(s) {
    return '<svg viewBox="0 0 320 200" role="img" aria-label="' + s.alt + '">' + s.art() + '</svg>';
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function show(id) {
    ['start', 'play', 'end'].forEach(function (k) { $(k).hidden = k !== id; });
    window.scrollTo(0, 0);
  }

  function loadBest() {
    try { var v = localStorage.getItem('baik-buruk-best'); if (v !== null) best = parseInt(v, 10); } catch (e) {}
    if (best !== null && !isNaN(best)) { $('best').hidden = false; $('bestText').textContent = 'Terbaik ' + best + '/10'; }
  }
  function saveBest() {
    if (best === null || score > best) {
      best = score;
      try { localStorage.setItem('baik-buruk-best', String(best)); } catch (e) {}
      $('best').hidden = false; $('bestText').textContent = 'Terbaik ' + best + '/10';
    }
  }

  function drawStars(el, upto) {
    var h = '';
    for (var i = 0; i < TOTAL; i++) {
      var cls = i < results.length ? (results[i] ? 'ok' : 'no') : (i === upto ? 'now' : '');
      h += '<span class="' + cls + '">' + STAR + '</span>';
    }
    el.innerHTML = h;
  }

  function render() {
    var s = order[idx];
    locked = false;
    $('count').textContent = 'Gambar ' + (idx + 1) + ' dari ' + TOTAL;
    drawStars($('stars'), idx);
    var sc = $('scene');
    sc.style.animation = 'none'; void sc.offsetWidth; sc.style.animation = '';
    sc.innerHTML = sceneSvg(s);
    $('caption').textContent = s.caption;
    $('answerArea').hidden = false;
    $('feedback').hidden = true;
  }

  function answer(choice) {
    if (locked) return;
    locked = true;
    var s = order[idx], ok = choice === s.kind;
    results.push(ok);
    if (ok) score++;
    drawStars($('stars'), -1);
    var kindText = s.kind === 'good' ? 'perilaku baik' : 'perilaku buruk';
    var head = ok ? 'Betul! Itu ' + kindText + '.' : 'Belum tepat. Itu ' + kindText + '.';
    var icon = ok
      ? '<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="#FFC62E" stroke="#C98E00" stroke-width="2"/><path d="M10 18.5l5.5 5.5L26 13" fill="none" stroke="#15314A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : '<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M18 10v10M18 25v1.5" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></svg>';
    var last = idx === TOTAL - 1;
    var fb = $('feedback');
    fb.className = 'feedback ' + s.kind;
    fb.innerHTML = '<h2>' + icon + '<span>' + head + '</span></h2>' +
      '<p class="why">' + s.why + '</p><p class="tip">' + s.tip + '</p>' +
      '<button class="primary" id="nextBtn" type="button">' + (last ? 'Lihat hasil' : 'Gambar berikutnya') + '</button>';
    $('answerArea').hidden = true;
    fb.hidden = false;
    fb.focus({ preventScroll: true });
    fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    $('nextBtn').addEventListener('click', next);
  }

  function next() {
    stopSpeech();
    idx++;
    if (idx >= TOTAL) return finish();
    render();
    $('caption').focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  function finish() {
    saveBest();
    drawStars($('endStars'), -1);
    $('endScore').textContent = score;
    var t, d;
    if (score >= 9) { t = 'Hebat sekali!'; d = 'Kamu sudah paham mana perilaku baik dan mana yang buruk.'; }
    else if (score >= 6) { t = 'Bagus!'; d = 'Kamu sudah banyak yang benar. Coba main lagi untuk gambar yang lain.'; }
    else { t = 'Ayo coba lagi!'; d = 'Tidak apa-apa salah. Dari situ kita belajar. Kamu pasti bisa.'; }
    $('endTitle').textContent = t;
    $('endText').textContent = d;
    show('end');
  }

  function start() {
    order = shuffle(SCENES).slice(0, TOTAL);
    idx = 0; score = 0; results = [];
    show('play');
    render();
  }

  /* Suara: hanya tampil jika peramban mendukung */
  function stopSpeech() { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {} }
  function speak() {
    try {
      stopSpeech();
      var u = new SpeechSynthesisUtterance(order[idx].caption);
      u.lang = 'id-ID'; u.rate = .9;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  try { if ('speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined') $('listen').hidden = false; } catch (e) {}

  /* Contoh di layar mulai */
  (function () {
    var pick = { good: SCENES[0], bad: SCENES[1] }, h = '';
    [['good', 'Baik', '<svg viewBox="0 0 36 36" aria-hidden="true"><path d="M8 18.5l6.5 6.5L28 11" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'],

    });
    $('samples').innerHTML = h;
  })();

  $('startBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);
  $('goodBtn').addEventListener('click', function () { answer('good'); });
  $('badBtn').addEventListener('click', function () { answer('bad'); });
  $('listen').addEventListener('click', speak);
